<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mafati Font Previewer</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #eeeeee;
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --card-bg: #2d2d2d;
      --text-color: #e0e0e0;
      --border-color: #444444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-color);
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .controls {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .control-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 18px;
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      resize: vertical;
      background: var(--card-bg);
      color: var(--text-color);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-top: 15px;
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 150px;
    }

    #previewContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .preview-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .font-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .font-name {
      font-size: 14px;
      font-weight: bold;
      color: #888;
      word-break: break-all;
    }

    .preview-text {
      flex-grow: 1;
      min-height: 80px;
      word-wrap: break-word;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .loading-overlay {
      text-align: center;
      padding: 50px;
      font-size: 20px;
      color: #888;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      background-color: #45a049;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background-color: #2196F3;
    }

    button.secondary:hover {
      background-color: #0b7dda;
    }

    button.outline {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }

    button.outline:hover {
      background-color: var(--border-color);
    }

    .search-box {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      flex-grow: 1;
      max-width: 300px;
    }

    @media (max-width: 600px) {
      #previewContainer {
        grid-template-columns: 1fr;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        max-width: none;
      }
    }
  </style>
</head>
<body>

  <h1>Mafati Font Previewer</h1>

  <div class="sticky-header">
    <div class="controls">
      <div class="control-group">
        <label for="inputText">Enter Text to Preview:</label>
        <textarea id="inputText" placeholder="ગૌતમ બુદ્ધ એ ભગવાન વિષ્ણુના નવમા અવતાર છે. તેમનો જન્મ લુંબિનીમાં થયો હતો." rows="3" oninput="updatePreviews()"></textarea>
      </div>

      <div class="toolbar">
        <div class="tool-item">
          <label>Size:</label>
          <input type="range" id="fontSize" min="12" max="100" value="32" oninput="updateStyles()">
          <span id="fontSizeDisplay">32px</span>
        </div>

        <div class="tool-item">
          <input type="text" id="searchFonts" class="search-box" placeholder="Search fonts..." oninput="filterFonts()">
        </div>

        <div class="tool-item">
          <button onclick="clearText()" class="outline">Clear</button>
          <button onclick="toggleDarkMode()" id="themeToggle" class="outline">🌙 Dark Mode</button>
        </div>
      </div>
    </div>
  </div>

  <div id="previewContainer">
    <div class="loading-overlay">Scanning ./fonts/ folder for new fonts...</div>
  </div>

  <script>
    // Configuration
    const REPO = "alihusains/custom-fonts-gujarati";
    const FOLDER_PATH = "mafati/fonts";

    // Fallback list of current fonts in mafati/fonts/
    const knownFonts = [
      "EAKEJH-GopikaThreeBold.ttf",
      "Gopika.ttf",
      "guj_dua.ttf",
      "me_quran.ttf",
      "NotoSansGujarati-VariableFont_wdth,wght.ttf",
      "sur.TTF",
      "tarjuma.ttf"
    ];

    let allFonts = [];

    async function init() {
      try {
        // Dynamic fetch from GitHub API for real-time updates on hosted site
        const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER_PATH}`);
        if (response.ok) {
          const data = await response.json();
          const apiFonts = data
            .filter(file => file.name.toLowerCase().endsWith(".ttf") || file.name.toLowerCase().endsWith(".otf"))
            .map(file => file.name);

          allFonts = [...new Set([...knownFonts, ...apiFonts])];
        } else {
          throw new Error("API Limit/Error");
        }
      } catch (e) {
        console.warn("Using fallback font list.", e);
        allFonts = knownFonts;
      }

      renderFonts();
    }

    function renderFonts() {
      const container = document.getElementById("previewContainer");
      container.innerHTML = "";

      const styleSheet = document.createElement("style");
      document.head.appendChild(styleSheet);

      allFonts.sort().forEach((font, index) => {
        const fontId = `font_${index}`;
        const displayName = font.replace(/\.(ttf|otf)/i, '').replace(/_/g, ' ');

        // Inject @font-face pointing to subfolder
        try {
          styleSheet.sheet.insertRule(`
            @font-face {
              font-family: "${fontId}";
              src: url("./fonts/${font}");
            }
          `, styleSheet.sheet.cssRules.length);
        } catch (err) {
          console.error(`Could not register font: ${font}`, err);
        }

        const card = document.createElement("div");
        card.className = "preview-card";
        card.dataset.name = font.toLowerCase();
        card.innerHTML = `
          <div class="font-info">
            <span class="font-name">${displayName}</span>
            <button class="outline" style="padding: 2px 6px; font-size: 10px;" onclick="copyFontName('${font}')">Copy Filename</button>
          </div>
          <div class="preview-text" id="preview_${index}" style="font-family: '${fontId}';"></div>
        `;
        container.appendChild(card);
      });

      updatePreviews();
      updateStyles();
    }

    function updatePreviews() {
      const text = document.getElementById("inputText").value || document.getElementById("inputText").placeholder;
      document.querySelectorAll(".preview-text").forEach(div => {
        div.innerText = text;
      });

      // Update URL search params
      const url = new URL(window.location);
      if (document.getElementById("inputText").value) {
        url.searchParams.set('text', document.getElementById("inputText").value);
      } else {
        url.searchParams.delete('text');
      }
      window.history.replaceState({}, '', url);
    }

    function updateStyles() {
      const size = document.getElementById("fontSize").value;
      document.getElementById("fontSizeDisplay").innerText = size + "px";
      document.querySelectorAll(".preview-text").forEach(div => {
        div.style.fontSize = size + "px";
      });
    }

    function filterFonts() {
      const query = document.getElementById("searchFonts").value.toLowerCase();
      document.querySelectorAll(".preview-card").forEach(card => {
        const name = card.dataset.name;
        card.style.display = name.includes(query) ? "flex" : "none";
      });
    }

    function clearText() {
      document.getElementById("inputText").value = "";
      updatePreviews();
    }

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle("dark-mode");
      document.getElementById("themeToggle").innerText = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    function copyFontName(name) {
      navigator.clipboard.writeText(name).then(() => {
        alert("Copied: " + name);
      });
    }

    // Initialize state
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('text')) {
      document.getElementById("inputText").value = urlParams.get('text');
    }

    if (localStorage.getItem("theme") === "dark") {
      toggleDarkMode();
    }

    // Start
    init();
  </script>

</body>
</html>
